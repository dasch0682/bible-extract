name: extract-topic
on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Nom du fichier topics/<sujet>.yml (sans extension)"
        required: true
        default: verite
      lang:
        description: "Langues à générer, séparées par virgule (défaut: toutes)"
        required: false
        default: ""
      mode:
        description: "Mode de découverte : rules (le code décide) ou model (le modèle juge la pertinence)"
        type: choice
        options: [rules, model]
        default: rules
      limit:
        description: "Garder seulement les N premiers candidats (défaut: tous)"
        required: false
        default: ""
      workers:
        description: "Parallélisme externe : nombre d'entrées traitées en simultané (défaut: 4)"
        required: false
        default: "4"
      workers_inner:
        description: "Parallélisme interne par entrée : context + paraphrase en simultané si >= 2 (défaut: 2)"
        required: false
        default: "2"
      mutualize_langs:
        description: "Un seul appel localize par label pour toutes les langues (défaut: true)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - run: pip install -r requirements.txt

      # --- Price check: first step, stops the batch before any model call ---
      - name: Price check
        run: python check_prices.py

      # --- Corpus preparation (cached across runs) ---
      - name: Cache corpora
        uses: actions/cache@v4
        id: corpus-cache
        with:
          path: data/*.json
          key: corpus-v1

      - name: Build FR corpus (LSG 1910)
        if: steps.corpus-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/BibleAquifer/LouisSegond1910 tmp/lsg1910
          python scripts/build_corpus.py fr

      - name: Build EN corpus (KJV)
        if: steps.corpus-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL https://raw.githubusercontent.com/scrollmapper/bible_databases/master/formats/json/KJV.json \
               -o tmp/kjv.json
          python scripts/build_corpus.py en

      # --- Strong's concordance data (byztxt, cached) ---
      - name: Cache byztxt
        uses: actions/cache@v4
        id: byztxt-cache
        with:
          path: tmp/byztxt
          key: byztxt-v1

      - name: Download byztxt Greek NT
        if: steps.byztxt-cache.outputs.cache-hit != 'true'
        run: git clone --depth 1 https://github.com/byztxt/byzantine-majority-text tmp/byztxt

      # --- Datasets read by the context step (speaker, dates, places), pinned in data/sources.lock.json ---
      - name: Cache datasets
        uses: actions/cache@v4
        with:
          path: |
            tmp/stepbible
            tmp/theographic
            tmp/openbible-geocoding
            tmp/speaker-quotations
            tmp/acai
          key: datasets-${{ hashFiles('data/sources.lock.json') }}

      - name: Fetch datasets
        run: python scripts/fetch_sources.py --fetch

      # --- Extraction ---
      - name: Extraction
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python extract.py \
            --topic "${{ inputs.topic }}" \
            --mode "${{ inputs.mode }}" \
            ${{ inputs.lang != '' && format('--lang {0}', inputs.lang) || '' }} \
            ${{ inputs.limit != '' && format('--limit {0}', inputs.limit) || '' }} \
            --workers "${{ inputs.workers }}" \
            --workers-inner "${{ inputs.workers_inner }}" \
            ${{ inputs.mutualize_langs && '--mutualize-langs' || '' }}

      - name: Résumé
        if: always()
        run: test -f "out/${{ inputs.topic }}.report.md" && cat "out/${{ inputs.topic }}.report.md" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Commit
        run: |
          git config user.name "bible-extract-bot"
          git config user.email "bot@users.noreply.github.com"
          git add out/
          git commit -m "extract: ${{ inputs.topic }}" || echo "rien à commiter"
          git push
