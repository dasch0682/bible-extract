label: "la vérité"
scope: NT              # NT | OT | ALL | liste de codes ex. [JHN, 1JN]
max_words: 14

# Strong's numbers (G = NT Greek) — primary discovery via byztxt Byzantine Greek NT
strongs:
  - G225   # ἀλήθεια  aletheia  — truth, reality
  - G227   # ἀληθής   alethes   — true, genuine
  - G228   # ἀληθινός alethinos — real, authentic
  - G230   # ἀληθῶς   alethos   — truly, certainly

# Regex cross-check applied on the FR corpus (text normalised: no accents, lowercase)
patterns:
  - '\bverit'          # vérité, véritable, véritablement (not "en vérité" — filtered below)
  - '\bvrai'           # vrai, vraie, vraiment

# Phrases stripped from the normalised text before pattern matching (Strong's unaffected).
# A verse whose only match was the introductory formula is counted in the report.
exclude_phrases:
  - '\ben verite\b'    # "en vérité (je vous dis)" — introductory formula, not a truth claim
  - '\bamen\b'         # Greek ἀμήν transliterated — same formula in some translations

extra_instructions: >-
  A verse where the only reason the word "vérité/truth" appears is the
  introductory formula "en vérité, en vérité, je vous le dis" (amen, amen)
  is NOT relevant to this theme — mark it pertinent: false.
