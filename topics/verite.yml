label: "la vérité"
label_fr: "la vérité"
label_en: "truth"
scope: NT              # NT | OT | ALL | liste de codes ex. [JHN, 1JN]
max_words: 14

# Strong's numbers (G = NT Greek) — primary discovery via byztxt Byzantine Greek NT
strongs:
  - G225   # ἀλήθεια  aletheia  — truth, reality
  - G227   # ἀληθής   alethes   — true, genuine
  - G228   # ἀληθινός alethinos — real, authentic
  - G230   # ἀληθῶς   alethos   — truly, certainly

# Regex cross-check applied on the FR corpus (text normalised: no accents, lowercase)
patterns:
  - '\bverit'          # vérité, véritable, véritablement (not "en vérité" — filtered below)
  - '\bvrai'           # vrai, vraie, vraiment

extra_instructions_fr: >-
  Nuance on the formula "en vérité / amen":
  (1) "Amen" used only as a liturgical closing (end of a doxology or prayer) is
  NOT relevant — mark pertinent: false.
  (2) The introductory formula "en vérité, en vérité, je vous le dis" (amen amen
  I say to you) does NOT by itself make a verse relevant. Judge the CONTENT that
  follows: if the verse addresses truth, reality, or genuine knowledge beyond the
  formula, it may be pertinent; if the formula is merely rhetorical emphasis on
  unrelated content, mark pertinent: false.

extra_instructions_en: >-
  Nuance on the formula "verily / amen":
  (1) "Amen" used only as a liturgical closing (end of a doxology or prayer) is
  NOT relevant — mark pertinent: false.
  (2) The introductory formula "Verily, verily, I say unto you" does NOT by itself
  make a verse relevant. Judge the CONTENT that follows: if the verse addresses
  truth, reality, or genuine knowledge beyond the formula, it may be pertinent;
  if the formula is merely rhetorical emphasis on unrelated content, mark pertinent: false.
